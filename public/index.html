<!DOCTYPE html> <html lang="fa" dir="rtl"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"> <meta name="theme-color" content="#f5f6f8"> <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=6"> <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=6"> <link rel="apple-touch-icon" href="icon-192.png?v=6"> <link rel="manifest" href="manifest.webmanifest?v=2"> <meta name="mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-capable" content="yes"> <meta name="apple-mobile-web-app-title" content="Mini Bot"> <meta name="apple-mobile-web-app-status-bar-style" content="default"> <title>Mini Bot</title> <link rel="preconnect" href="https://fonts.googleapis.com"> <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"> <link rel="stylesheet" href="style.css?v=42"> <style> /* ---------- شیت ساخت حساب (inline: مستقل از کش CSS) ---------- */ .ss-wrap{position:fixed;inset:0;z-index:600;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,23,42,0);visibility:hidden;opacity:0;transition:opacity .22s,visibility .22s} .ss-wrap.open{background:rgba(15,23,42,.45);visibility:visible;opacity:1} .ss-box{width:100%;max-width:340px;margin:0 10px 12px;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 24px 60px -24px rgba(13,42,94,.5);transform:translateY(110%);transition:transform .28s cubic-bezier(.22,.9,.32,1)} .ss-wrap.open .ss-box{transform:none} .ss-title{text-align:center;font-weight:800;font-size:15.5px;padding:15px 16px 12px;border-bottom:1px solid #eef1f7} .ss-opt{display:flex;width:100%;align-items:center;gap:13px;padding:13px 17px;background:none;border:none;text-align:right;cursor:pointer} .ss-opt+.ss-opt{border-top:1px solid #f2f5fa} .ss-opt:active{background:#f5f8fe} .ss-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0} .ss-ic .icon{width:19px;height:19px} .ss-free{background:#eaf3ff;color:#1e7ff5} .ss-pro{background:#eafaf0;color:#0e9f5d} .ss-vip{background:#fdf3e7;color:#d98a13} .ss-txt{flex:1;display:flex;flex-direction:column;gap:2px} .ss-t{font-weight:700;font-size:14.5px} .ss-s{font-size:12px;color:var(--text-dim)} .ss-close{width:100%;padding:13px;background:#f7f9fd;border:none;border-top:1px solid #eef1f7;font-weight:700;font-size:14px;cursor:pointer;color:var(--text-dim)} .trial-wrap{position:fixed;inset:0;z-index:610;display:flex;align-items:center;justify-content:center;background:rgba(15,23,42,0);visibility:hidden;opacity:0;transition:opacity .22s,visibility .22s;padding:22px} .trial-wrap.open{background:rgba(15,23,42,.5);visibility:visible;opacity:1} .trial-box{width:100%;max-width:300px;background:#fff;border-radius:22px;padding:20px 17px 16px;box-shadow:0 30px 70px -28px rgba(13,42,94,.5);transform:scale(.92) translateY(10px);transition:transform .24s cubic-bezier(.22,.9,.32,1)} .trial-wrap.open .trial-box{transform:none} .trial-title{text-align:center;font-weight:800;font-size:17px} .trial-sub{text-align:center;font-size:12.5px;color:var(--text-dim);margin:6px 0 15px;line-height:1.7} .trial-err{display:none;margin:10px 0 0;padding:8px 11px;border-radius:10px;background:rgba(220,38,38,.09);color:var(--danger);font-size:12.5px;line-height:1.6;text-align:center} .trial-server{display:flex;align-items:center;justify-content:center;gap:7px;margin:0 0 14px;padding:8px 11px;border-radius:10px;background:rgba(34,99,197,.08);color:#2263c5;font-size:12.5px;font-weight:600;line-height:1.6} .trial-server .icon{width:15px;height:15px;flex:0 0 auto} /* ---------- ظاهر و نمایش (v13.3): کنترل‌های سفارشی‌سازی ---------- */ .ap-card{background:var(--bg-2);border:1px solid var(--border-soft);border-radius:var(--r-lg);padding:13px 14px 15px;margin:0 0 12px;box-shadow:var(--shadow-card)} .ap-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13.5px;color:var(--text)} .ap-head .icon{width:17px;height:17px;color:var(--accent);flex:0 0 auto} .ap-swrow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none} .ap-swrow::-webkit-scrollbar{display:none} .ap-sw{flex:0 0 auto;width:52px;height:52px;border-radius:var(--r-md);border:2px solid var(--border);cursor:pointer;position:relative;background:var(--bg-3)} .ap-sw.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)} .ap-sw .icon{position:absolute;inset:0;margin:auto;width:17px;height:17px;color:var(--accent);opacity:0;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))} .ap-sw.sel .icon{opacity:1} .ap-dot{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--border);cursor:pointer;background:var(--bg-3)} .ap-dot.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)} .ap-themes{display:flex;gap:9px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none} .ap-themes::-webkit-scrollbar{display:none} .ap-theme{flex:0 0 auto;width:88px;height:64px;border-radius:var(--r-md);border:2px solid var(--border);cursor:pointer;padding:8px 7px;display:flex;flex-direction:column;gap:4px;background:var(--bg-3)} .ap-theme.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)} .ap-theme .t-bub{width:34px;height:9px;border-radius:5px} .ap-theme .t-ico{margin-top:auto;margin-inline-start:auto} .ap-theme .t-ico .icon{width:13px;height:13px;color:var(--text-faint)} .ap-theme.sel .t-ico .icon{color:var(--accent)} .ap-hint{font-size:11.5px;color:var(--text-faint);margin:7px 2px 0;line-height:1.7} /* پس‌زمینه‌های پنل */ html[data-mbbg="1"]{--mb-chat-color:#e3ecf8}html[data-mbbg="1"] body{background:linear-gradient(165deg,#dce9f9 0%,#f3f7fc 55%,#e6edf8 100%)} html[data-theme="dark"][data-mbbg="1"]{--mb-chat-color:#0f1626}html[data-theme="dark"][data-mbbg="1"] body{background:linear-gradient(165deg,#12203a 0%,#0a0c11 55%,#0e1626 100%)} html[data-mbbg="2"]{--mb-chat-color:#e2f2e9}html[data-mbbg="2"] body{background:linear-gradient(165deg,#dcefe4 0%,#f0f7f3 55%,#e4f1ea 100%)} html[data-theme="dark"][data-mbbg="2"]{--mb-chat-color:#0e1a14}html[data-theme="dark"][data-mbbg="2"] body{background:linear-gradient(165deg,#10241a 0%,#0a0c11 55%,#0e1a14 100%)} html[data-mbbg="3"]{--mb-chat-color:#faeee2}html[data-mbbg="3"] body{background:linear-gradient(165deg,#f9e6d8 0%,#fbf3ec 55%,#f7ecdf 100%)} html[data-theme="dark"][data-mbbg="3"]{--mb-chat-color:#1c150d}html[data-theme="dark"][data-mbbg="3"] body{background:linear-gradient(165deg,#2b1d10 0%,#0a0c11 55%,#1c150d 100%)} html[data-mbbg="4"]{--mb-chat-color:#eae4f9}html[data-mbbg="4"] body{background:linear-gradient(165deg,#e9e2fa 0%,#f4f1fd 55%,#e6dff9 100%)} html[data-theme="dark"][data-mbbg="4"]{--mb-chat-color:#131028}html[data-theme="dark"][data-mbbg="4"] body{background:linear-gradient(165deg,#1d1738 0%,#0a0c11 55%,#131028 100%)} html[data-mbbg="5"]{--mb-chat-color:#e9edf3}html[data-mbbg="5"] body{background-image:radial-gradient(circle at 18px 20px,rgba(25,111,240,.12) 2.2px,transparent 2.8px);background-size:36px 36px} html[data-theme="dark"][data-mbbg="5"]{--mb-chat-color:#0d1119}html[data-theme="dark"][data-mbbg="5"] body{background-image:radial-gradient(circle at 18px 20px,rgba(255,255,255,.045) 2.2px,transparent 2.8px);background-size:36px 36px} /* رنگ نام شما */ html[data-mbnc="1"]{--mb-name-color:#e05b7b}html[data-mbnc="2"]{--mb-name-color:#0e9f5d}html[data-mbnc="3"]{--mb-name-color:#d98a13}html[data-mbnc="4"]{--mb-name-color:#8b5cf6}html[data-mbnc="5"]{--mb-name-color:#14b8c4} .profile-hero-title{color:var(--mb-name-color,var(--text))} /* ---------- حساب کاربری به سبک تلگرام (v13.4) ---------- */ .tg-sep{height:1px;background:var(--border-soft);margin:0 18px} .acct-check{margin-inline-start:auto;width:38px;height:38px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--accent);display:none;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,transform .15s} .acct-check.show{display:flex;animation:acctCheckIn .18s ease both} .acct-check:active{background:var(--accent-glow);transform:scale(.92)} .acct-check .icon{width:24px;height:24px;stroke-width:2.6} .acct-check.busy{opacity:.45;pointer-events:none} @keyframes acctCheckIn{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}} </style> </head> <body>
